{% extends "base.html" %}
{% block titel %}Vælg adgangskode{% endblock %}
{% block indhold %}
<div class="login-boks kort">
  <h1>{{ 'Velkommen' if invitation else 'Ny adgangskode' }}</h1>
  <p class="muted">{{ 'Vælg en adgangskode til din bruger.' if invitation else 'Vælg en ny adgangskode.' }} Mindst 8 tegn.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <div class="felt"><label>Adgangskode</label><input type="password" name="kode" autocomplete="new-password" minlength="8" required autofocus></div>
    <div class="felt"><label>Gentag adgangskode</label><input type="password" name="kode2" autocomplete="new-password" minlength="8" required></div>
    <button style="width:100%">Gem og log ind</button>
  </form>
</div>
{% endblock %}
