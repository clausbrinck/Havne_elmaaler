{% extends "base.html" %}
{% block titel %}Log ind{% endblock %}
{% block indhold %}
<div class="login-boks kort">
  <img class="login-logo" src="{{ url_for('static', filename='logo.png') }}" alt="{{ klub }}" width="112" height="112">
  <h1>Elmålere</h1>
  <p class="muted">Følg din båds strømforbrug på havnens elstandere.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <div class="felt"><label for="email">E-mail</label><input type="email" id="email" name="email" autocomplete="username" required autofocus></div>
    <div class="felt"><label for="kode">Adgangskode</label><input type="password" id="kode" name="kode" autocomplete="current-password" required></div>
    <button style="width:100%">Log ind</button>
  </form>
  <p class="muted" style="margin-top:14px"><a href="{{ url_for('glemt') }}">Glemt adgangskode?</a></p>
</div>
{% endblock %}
